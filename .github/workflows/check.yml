name: Checks
on:
  push:
    branches: [develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v redis-server >/dev/null; then
            if ! sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg redis-server; then
              sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
              sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg redis-server
            fi
          fi
          ffmpeg -version
          redis-server --version
        timeout-minutes: 4
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
        timeout-minutes: 5
      - run: python -m pytest -q
      - run: python -m compileall -q marina
      - run: bash -n scripts/deploy.sh
      - run: ruff check marina
      - run: ruff format --check marina tests
