name: Prepare audited funnel fixes
on:
  push:
    branches: ['fix/funnel-doc-release-20261104']
    paths: ['scripts/prepare_funnel_release.py', 'tests/test_funnel_release_regressions.py', '.github/workflows/funnel-audit-prepare.yml']
permissions:
  contents: write
concurrency:
  group: marina-funnel-audit-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Bambale0/marina' && github.ref == 'refs/heads/fix/funnel-doc-release-20261104'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/funnel-doc-release-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Capture failing regressions before the fix
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_funnel_release_regressions.py --tb=short > /tmp/funnel-red.log 2>&1
          result=$?
          cat /tmp/funnel-red.log
          test "$result" -eq 1 || exit 1
          grep -Eq '[0-9]+ failed' /tmp/funnel-red.log || exit 1
          if grep -Eq 'ERROR collecting|INTERNALERROR' /tmp/funnel-red.log; then exit 1; fi
      - name: Apply the bounded source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/prepare_funnel_release.py')
          text = p.read_text()
          old = 'def test_result_buttons_match_green_and_red_paths(app):'
          new = 'def test_result_removes_consultation_buttons_but_keeps_configured_paths(app):'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
          python scripts/prepare_funnel_release.py --apply
      - name: Format and verify the exact resulting files
        run: |
          ruff format marina tests
          python -m pytest -q --tb=short
          python -m compileall -q marina
          ruff check marina
          ruff format --check marina tests
          git diff --check
      - name: Commit only the reviewed code and tests to the same feature branch
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/funnel-doc-release-20261104
          base=$(git rev-parse HEAD)
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marina/funnel.py marina/funnel_bot.py marina/commerce.py marina/providers.py marina/operations.py tests/test_funnel.py tests/test_funnel_release_regressions.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve payment confirmation and source-defined funnel transitions'
          git push origin "HEAD:refs/heads/$branch"
      - name: Retain pure-Python test dependencies for offline reproduction
        if: always()
        run: |
          pip download --only-binary=:all: --no-deps flask==3.1.2 werkzeug==3.1.9 click==8.5.0 itsdangerous==2.2.0 blinker==1.9.0 python-dotenv==1.1.1 --dest audit-wheels
      - name: Retain public source and regression evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-funnel-source
          retention-days: 7
          path: |
            marina/*.py
            marina/static/*
            tests/*.py
            scripts/*.py
            audit-wheels/*.whl
            requirements*.txt
            requirements.lock
            pyproject.toml
            AGENTS.md
            CONTRIBUTING.md
