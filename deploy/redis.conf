# Private to Marina; no TCP listener.
bind 127.0.0.1
port 0
unixsocket /var/lib/marina/redis/redis.sock
unixsocketperm 700
protected-mode yes
daemonize no
supervised no
dir /var/lib/marina/redis
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
maxmemory 256mb
maxmemory-policy noeviction
logfile ""
loglevel warning
